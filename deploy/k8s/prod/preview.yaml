# Temporary: production at moleonline-prod.dyn.cloud.e-infra.cz on the cluster's shared Gateway, which has the wildcard
# certificate and DNS of *.dyn.cloud.e-infra.cz, to try it out before its own domains resolve to the cluster. Remove it,
# with its line in kustomization.yaml, after the switch.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: moleonline-preview
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - moleonline-prod.dyn.cloud.e-infra.cz
  rules:
    - backendRefs:
        - name: moleonline-web
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: moleonline-preview-redirect
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
      sectionName: web
  hostnames:
    - moleonline-prod.dyn.cloud.e-infra.cz
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
